    {n:2, pregunta:'¿Puede pagar si empeora? — DSCR estrés', resultado:b104, fmt:'x', estado:estado104, interpretacion:interp104},
    {n:3, pregunta:'¿Cuánto deterioro soporta? — Punto de quiebre - Caída en Ventas', resultado:b105, fmt:'pct', estado:estado105, interpretacion:interp105},
    {n:4, pregunta:'¿Qué respaldo tiene? — Activos recuperables', resultado:b106, fmt:'bs', estado:estado106, interpretacion:interp106},
    {n:5, pregunta:'Liquidez inmediata', resultado:b107, fmt:'bs', estado:estado107, interpretacion:interp107},
    {n:6, pregunta:'Colchón de deuda — ¿Cuántos meses puede pagar deuda?', resultado:b108, fmt:'num', estado:estado108, interpretacion:interp108},
    {n:7, pregunta:'Meses de supervivencia - ¿Cuánto puede sobrevivir?', resultado:b109, fmt:'num', estado:estado109, interpretacion:interp109},
    {n:8, pregunta:'¿Qué respaldo patrimonial tiene?', resultado:b110, fmt:'bs', estado:estado110, interpretacion:interp110},
    {n:9, pregunta:'¿Qué garantía recuperable tiene?', resultado:b111, fmt:'bs', estado:estado111, interpretacion:interp111},
    {n:10, pregunta:'LGD — pérdida después de recuperación', resultado:b112, fmt:'pct', estado:estado112, interpretacion:interp112},
    {n:11, pregunta:'¿Qué tan resistente es? — Resiliencia (X/100)', resultado:b113, fmt:'num0', estado:estado113, interpretacion:interp113},
    {n:12, pregunta:'¿Cuánto podemos perder en términos esperados? — ¿Cuál es su PE?', resultado:b116, fmt:'bs', estado:estado116, interpretacion:interp116},
  ];

  return { params:{caidaVentas,aumentoCV,aumentoCF,aumentoGastosFam,shockCambiario},
    b24,b30,b31,b35,b36,b38,b39,b40,b41,b42,b43,b44,b47,b48,b52,b54,b55,b56,b57,b58,
    b61,b62,b63,b64,b65,b66,b67,b68,b69,b70,b78,b79,
    hayVeto, causaPrincipal, decision:b91, montoRecomendado:b94, montoMaximoTecnico:b93,
    medidaMitigacion, condicion, controlPosterior, diagnosticoTexto, dictamenCompleto,
    filas };
}

function calcTodo(S){
  const cc = calcCliente(S);
  const est = calcVentasEstimaciones(S, cc);
  const flujo = calcFlujo(S, est.ventaAdoptada);
  const balance = calcBalance(S, flujo);
  const colateral = calcColateral(S);
  const scoring = calcScoring(S);
  const resolucion = calcResolucion(S, scoring, flujo, colateral);
  const cruces = calcVentasCruces(S, flujo, balance, cc, est);
  const ventasHist = { ...est, cruces };
  const analisisIA = calcAnalisisIA(S, scoring, resolucion, flujo);
  const diagnosticoIA = calcDiagnosticoIA(S, flujo, balance, scoring);
  const autoSugerencias = calcAutoSuggestions(S, flujo, balance, colateral);
  const incertidumbre = calcIncertidumbre(S, flujo, balance, colateral, scoring, resolucion);
  return { flujo, balance, colateral, scoring, resolucion, ventasHist, analisisIA, diagnosticoIA, autoSugerencias, incertidumbre };
}

<script>
// ============================================================================
// APP — navegación, formularios dinámicos y render
// ============================================================================
let S = JSON.parse(JSON.stringify(ESTADO_INICIAL));

function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let o = obj;
  for (let i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}

// ---------------------------------------------------------------------------
// Navegación entre pantallas
// ---------------------------------------------------------------------------
function goScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.topnav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  const navBtn = document.querySelector('.topnav button[data-nav="'+name+'"]');
  if (navBtn) navBtn.classList.add('active');
  window.scrollTo(0,0);
  if (name!=='guardadas') renderGuardadasBadge();
}

// ---------------------------------------------------------------------------
// Inputs simples (data-path) — binding genérico
// ---------------------------------------------------------------------------
function field(label, path, type='text', extra=''){
  const val = getPath(S, path);
  const v = (val===undefined || val===null) ? '' : val;
  return `<div class="field"><label>${label}</label>
    <input type="${type}" data-path="${path}" value="${escAttr(v)}" ${extra}></div>`;
}
function selectField(label, path, options){
  const val = getPath(S, path) || '';
  const opts = options.map(o=>`<option value="${escAttr(o)}" ${o===val?'selected':''}>${o}</option>`).join('');
  return `<div class="field"><label>${label}</label><select data-path="${path}">
    <option value="">— Seleccionar —</option>${opts}</select></div>`;
}
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function attachBindings(container){
  container.querySelectorAll('[data-path]').forEach(el=>{
    const handler = () => {
      let v = el.value;
      if (el.type==='number') v = v===''? '' : parseFloat(v);
      setPath(S, el.dataset.path, v);
      recalc();
    };
    el.addEventListener('input', handler);
    if (el.tagName === 'SELECT') el.addEventListener('change', handler);
  });
}

  <div class="card"><h2>C. Datos de la Solicitud de Crédito</h2><div class="grid2">

function renderArrayTable(key, cols, labels){
  const tbody = document.querySelector('#tbl-'+(key==='costoVentasMes'?'costoventas':key)+' tbody');
  if (!tbody) return;
  tbody.innerHTML = (S[key]||[]).map((row,i)=>{
    const tds = cols.map(c=>`<td><input type="${c==='item'||c==='unidad'||c==='producto'?'text':'number'}" step="0.01"
      value="${escAttr(row[c]??'')}" data-arr="${key}" data-idx="${i}" data-field="${c}"></td>`).join('');
    let totalCell = '';
    if (key==='inventario') totalCell = `<td>${fmtBs(num(row.cantidad)*num(row.precioUnit))}</td>`;

    return `<tr>${tds}${totalCell}<td><button class="small-btn" onclick="removeRow('${key}',${i})">✕</button></td></tr>`;
  }).join('');
  tbody.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      let v = inp.value===''? '' : (inp.type==='number'? parseFloat(inp.value) : inp.value);
      S[inp.dataset.arr][parseInt(inp.dataset.idx)][inp.dataset.field] = v;
      recalc();
      renderArrayTable(key, cols, labels);
    });
  });
  if (key==='inventario'){
    const t = (S.inventario||[]).reduce((a,r)=>a+num(r.cantidad)*num(r.precioUnit),0);

    const elt = document.getElementById('total-costoventas'); if(elt) elt.textContent = fmtBs(t);
  }
}

  if (key==='inventario') renderArrayTable('inventario', ['item','cantidad','unidad','precioUnit']);
  if (key==='costoVentasMes') renderArrayTable('costoVentasMes', ['item','frecuencia','unidad','cantidad','precioUnit']);
  if (key==='produccion') renderArrayTable('produccion', ['producto','cantidadDia']);

function updateBalanceSubtotals(){
  ['activoCorriente','activoNoCorriente','pasivoCorriente','pasivoNoCorriente','patrimonio'].forEach(grp=>{
    ['anterior','actual'].forEach(periodo=>{
      const obj = (S.balance[periodo]||{})[grp] || {};
      const sum = Object.values(obj).reduce((a,v)=>a+num(v),0);
      const elt = document.getElementById(`subtotal-${grp}-${periodo}`);
      if (elt) elt.textContent = fmtBs(sum);
    });
  });
}

function syncAutoScoring(){
  if (!S.scoringAuto) S.scoringAuto = {};
  const sug = calcTodo(S).autoSugerencias;
  AUTO_SCORING_IDS.forEach(id=>{
    if (S.scoringAuto[id] !== false){
      S.scoring[id] = sug[id];
      S.scoringAuto[id] = true;
    }
  });
}
function renderScoring(){
  syncAutoScoring();
  const el = document.getElementById('screen-scoring');
  let html = `<h1>Scoring — 5 Cs del Crédito</h1>
  <p class="hint">Toque la escala que mejor describe cada criterio (1=Excelente ... 4=Deficiente). Los criterios marcados 🤖 se completan automáticamente con los datos ya cargados en Flujo/Balance/Colateral — igual puedes cambiarlos si no estás de acuerdo.</p>
  <div id="scoring-alert"></div>`;
  let currentCat = null;
  SCORING_CRITERIA.forEach(row=>{
    if (row.type==='cat'){
      currentCat = row.label;
      html += `<div class="cat-header"><span>${row.label}</span><span>${row.ptsmax} pts</span></div>`;
    } else {
      const sel = S.scoring[row.id] || 0;
      const esAuto = S.scoringAuto && S.scoringAuto[row.id];
      const tagHtml = sel===0 ? ' <span class="tag bad">Sin responder</span>' : (esAuto ? ' <span class="tag ok">🤖 Automático</span>' : '');
      html += `<div class="scoring-item ${sel===0?'sin-responder':''}">
        <div class="head"><span>${row.id} ${row.label}${tagHtml}</span><span class="tag">${fmtNum(row.ptsmax,1)} pts máx</span></div>
        <div class="desc">${row.desc||''}</div>
        <div class="scale-opts">
          ${[1,2,3,4].map(n=>`<div class="scale-opt sel-${n} ${sel==n?'active':''}" data-crit="${row.id}" data-val="${n}">
            <b>${n}.</b> ${row['e'+n]||''}</div>`).join('')}
        </div>
      </div>`;
    }
  });
  html += `<div class="card" id="scoring-rac"></div>`;
  el.innerHTML = html;
  el.querySelectorAll('.scale-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      S.scoring[opt.dataset.crit] = parseInt(opt.dataset.val);
      if (AUTO_SCORING_IDS.includes(opt.dataset.crit)){
        if (!S.scoringAuto) S.scoringAuto = {};
        S.scoringAuto[opt.dataset.crit] = false;
      }
      recalc();
      renderScoring();
    });
  });
  renderScoringAlert();
  renderScoringRAC();
}
function renderScoringAlert(){
  const box = document.getElementById('scoring-alert');

  tbody.innerHTML = res.componentes.map((c,i)=>`<tr>
    <td>${c.n}</td><td>${c.nombre}</td>
    <td class="right">${fmtPct(c.peso)}</td>
    <td class="right">${fmtNum(c.ptsMax,0)}</td><td class="right">${fmtNum(c.obtenido,1)}</td>
    <td class="right"><span class="badge ${c.semaforo==='✔'?'ok':(c.semaforo==='⚠'?'warn':'bad')}">${c.semaforo}</span></td>
  </tr>`).join('');
  document.getElementById('td-suma-pesos').textContent = fmtPct(res.sumPesos);
  document.getElementById('td-suma-ptsmax').textContent = fmtNum(res.totalPtsMax,0);
  document.getElementById('td-score-final').textContent = fmtNum(res.scoreFinal,1);
  const badge = document.getElementById('badge-categoria-final');
  if (badge){ badge.textContent = res.categoriaFinal; badge.className = 'badge '+res.categoriaFinalClase; }
}
function field2(label, value){
  return `<div class="field"><label>${label}</label><input value="${escAttr(value||'')}" disabled></div>`;
}
function imprimirTodo(){
  document.body.classList.remove('print-resolucion-only');
  window.print();
}
function imprimirResolucion(){
  document.body.classList.add('print-resolucion-only');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-resolucion-only'), 500);
}

  <p class="hint">Sistema basado en reglas ASFI + lógica multivariable + recomendaciones adaptativas.</p>

  <div class="card">

    ${sc.pendientes>0 ? `<div class="alert warn">⚠ ${sc.pendientes} criterios del Scoring sin responder — este dictamen es preliminar.</div>` : ''}
    <div class="alert ${sc.total>=800?'ok':(sc.total>=600?'warn':'bad')}" style="font-weight:700">${ia.dictamen}</div>
    <p style="margin-top:10px">${ia.diagnostico}</p>

    <h2>Condiciones Crediticias Recomendadas por el Sistema IA</h2>

      <tr><td>Garantía Sugerida</td><td class="right">${ia.condiciones.garantia}</td></tr>
      <tr><td>Frecuencia de Seguimiento</td><td class="right">${ia.condiciones.seguimiento}</td></tr>
      <tr><td>Nivel de Aprobación Requerido</td><td class="right">${ia.condiciones.nivelAprobacion}</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>Análisis de Factores de Riesgo — Motor IA</h2>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Factor</th><th>Pts</th><th>Max</th><th>Logro</th><th>Diagnóstico IA</th></tr></thead>
      <tbody>${ia.factores.map(f=>`<tr><td>${f.factor}</td><td class="right">${fmtNum(f.obtenido,0)}</td>
        <td class="right">${fmtNum(f.max,0)}</td><td class="right">${fmtPct(f.logro)}</td><td>${f.diagnostico}</td></tr>`).join('')}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Cómo Activar Análisis IA con ChatGPT o Claude</h2>
    <ol style="padding-left:18px; font-size:13.5px; line-height:1.6">
      <li>Copia los datos del cliente y el score obtenido con el botón de abajo.</li>
      <li>Abre ChatGPT (chatgpt.com) o Claude (claude.ai) en tu navegador.</li>
      <li>Pega el prompt copiado — ya incluye el perfil completo del cliente.</li>
      <li>La IA entregará análisis cualitativo, detección de anomalías y recomendaciones específicas del sector económico boliviano.</li>
    </ol>
    <button class="btn btn-primary btn-block" id="btn-copiar-prompt" onclick="copiarPromptIA()">📋 Copiar Prompt para IA</button>
    <p class="hint" id="copiar-prompt-status" style="margin-top:8px"></p>
  </div>
  `;
}
function copiarPromptIA(){
  const R = calcTodo(S);
  const sc = R.scoring, res = R.resolucion;
  const nombreCompleto = [S.cliente.nombres, S.cliente.apPaterno, S.cliente.apMaterno].filter(Boolean).join(' ') || '(sin nombre)';
  const prompt = `Eres analista de microcrédito de una IFD en Bolivia. Evalúa este perfil según normativa ASFI y la metodología de las 5 Cs del Crédito. Analiza el riesgo, recomienda condiciones y justifica la decisión.

Cliente: ${nombreCompleto}
Actividad Económica: ${S.negocio.actividad || '—'}
Antigüedad del negocio: ${S.negocio.antiguedad || 0} años
Monto solicitado: Bs. ${num(S.credito.monto)}
Plazo: ${S.credito.plazoMeses || 0} meses
Score 5Cs: ${fmtNum(sc.total,0)} / 1000 pts (${sc.categoriaRiesgo})
RAC Generado: ${fmtPct(res.racGenerado)} (requerido: ${fmtPct(res.racRequerido)})
Probabilidad de Default: ${fmtPct(sc.pd)}
Score Final Consolidado: ${fmtNum(res.scoreFinal,1)} pts (${res.categoriaFinal})`;

  const status = document.getElementById('copiar-prompt-status');
  const done = () => { if (status) status.textContent = '✔ Prompt copiado — pégalo en ChatGPT o Claude.'; };
  const fail = () => { if (status) status.textContent = 'No se pudo copiar automáticamente. Selecciona y copia el texto manualmente.'; };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(prompt).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement('textarea');
      ta.value = prompt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      done();
    } catch(e){ fail(); }
  }
}

// GUARDAR / EVALUACIONES GUARDADAS (localStorage — funciona sin conexión)
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'evaluaciones_produccion_v1';
function getGuardadas(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ return []; }
}
function guardarEvaluacion(){
  const R = calcTodo(S);
  const nombreCompleto = [S.cliente.nombres, S.cliente.apPaterno, S.cliente.apMaterno].filter(Boolean).join(' ') || 'Sin nombre';
  const list = getGuardadas();
  list.unshift({
    id: Date.now(),
    fecha: new Date().toLocaleString('es-BO'),
    nombre: nombreCompleto,
    actividad: S.negocio.actividad || '—',
    monto: num(S.credito.monto),
    score: R.scoring.total,
    categoria: R.scoring.categoriaRiesgo,
    estado: JSON.parse(JSON.stringify(S)),
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  renderGuardadas();
  alert('Evaluación guardada en este celular.');
}
function renderGuardadasBadge(){
  const n = getGuardadas().length;
  const b = document.getElementById('nav-badge-guardadas');
  if (b) b.textContent = n>0 ? n : '';
}
function renderGuardadas(){
  const el = document.getElementById('screen-guardadas');
  const list = getGuardadas();
  el.innerHTML = `<h1>Evaluaciones Guardadas</h1>` + (list.length===0
    ? `<p class="muted">Aún no hay evaluaciones guardadas en este celular.</p>`
    : list.map(ev=>`
      <div class="card">
        <div class="row-flex">
          <div><b>${ev.nombre}</b><div class="meta">${ev.actividad} · ${ev.fecha}</div></div>
          <span class="badge ${ev.categoria.includes('BAJO')?'risk-1':ev.categoria.includes('MEDIO')?'risk-2':ev.categoria.includes('ALTO')&&!ev.categoria.includes('MUY')?'risk-3':'risk-4'}">${ev.score.toFixed(0)} pts</span>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="small-btn" onclick="cargarEvaluacion(${ev.id})">Abrir</button>
          <button class="small-btn" onclick="eliminarEvaluacion(${ev.id})">Eliminar</button>
        </div>
      </div>`).join(''));
  renderGuardadasBadge();
}
function cargarEvaluacion(id){
  const list = getGuardadas();
  const ev = list.find(e=>e.id===id);
  if (!ev) return;
  S = JSON.parse(JSON.stringify(ev.estado));
  renderAll();
  goScreen('cliente');
}
function eliminarEvaluacion(id){
  if (!confirm('¿Eliminar esta evaluación guardada?')) return;
  const list = getGuardadas().filter(e=>e.id!==id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  renderGuardadas();
}

  renderAll();

      goScreen(b.dataset.nav);
    });
  });
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
});
